; Type-checking policy for the automation stack.
;
; The bot handles money, and its worst bugs have been silent ones: a mistyped key
; resolving to a default, a signature change swallowed by `except TypeError`. Static
; checking is scoped in tiers so it stays actionable instead of producing a wall of
; noise that nobody reads.
;
; Run: python3 -m mypy --config-file mypy.ini

[mypy]
python_version = 3.11
mypy_path = automation
files = automation
exclude = (?x)(automation/test_.*\.py$)
namespace_packages = False
explicit_package_bases = False

; Third-party chain libraries ship incomplete or absent stubs; their absence must
; not mask errors in our own code.
ignore_missing_imports = True
follow_imports = normal

; Baseline for the whole stack. check_untyped_defs is the one that pays for itself
; on legacy code: it checks inside functions that carry no annotations yet, so the
; modules benefit before anyone has finished annotating them.
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_configs = True
strict_equality = True
warn_unreachable = True

; mypy 2.x demands annotations by default. Requiring them everywhere at once buries
; the ~70 real findings under ~1000 "not annotated yet" reports, so annotation is
; required only in the strict tier below and the rest is checked on its merits.
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
implicit_reexport = True

; --------------------------------------------------------------------------- ;
; Tier 1 — money math and schema. Pure, fully annotated, no external calls.
; These must stay strict; a regression here is a wrong number, not a crash.
; --------------------------------------------------------------------------- ;

; `strict = True` is a global-only option: mypy silently applies it to every module
; when written in a per-module section, which drowns the whole stack. The strict
; flags are therefore spelled out here.
[mypy-risk]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_any_generics = True
no_implicit_optional = True
warn_return_any = True
warn_no_return = True

[mypy-positions]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_any_generics = True
no_implicit_optional = True
warn_return_any = True
warn_no_return = True

; --------------------------------------------------------------------------- ;
; Tier 2 — money paths under migration. Annotations are being added incrementally;
; promote each to `strict = True` as it is finished.
; --------------------------------------------------------------------------- ;

[mypy-lifecycle]
disallow_incomplete_defs = True

; --------------------------------------------------------------------------- ;
; Tier 3 — tests. Assertions on loosely typed fixtures are expected.
; --------------------------------------------------------------------------- ;

; Tests are excluded via `exclude` above rather than relaxed here: nearly every
; finding in them was an assertion narrowing an Optional the checker cannot follow
; (`assertGreater(maybe_none, 0)`), which is noise rather than a defect. Their
; correctness is enforced by running them, not by typing them.
